# Records Derive's options surface and trade flow every 15 minutes, computes the signals on
# Derive's perps after each 4H and daily close and extends the options traders' history, into the
# `data` branch; then rebuilds the app's data files on the `site-data` branch.
# Started every 5 minutes by an external cron service through workflow_dispatch; GitHub's own
# schedule below is a backup (minutes 2, 7, ..., 57). Each 15-minute slot and each closed bar
# is processed once, so repeated starts do no harm.
name: record

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: record
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          if git fetch -q --depth 1 origin data; then
            git worktree add -q -B data store FETCH_HEAD
          else
            git worktree add -q --orphan -b data store
          fi

      - name: Previous app data
        run: |
          mkdir -p site
          if git fetch -q --depth 1 origin site-data; then git archive FETCH_HEAD | tar -x -C site; fi

      - name: Due?
        id: due
        working-directory: backend
        run: |
          python3 record_once.py --out ../store --due
          python3 signal_once.py --out ../store --due
          python3 history_once.py --out ../store --due

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        if: steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true'
        run: pip install -q httpx numpy

      - name: Record
        if: steps.due.outputs.due == 'true'
        working-directory: backend
        run: python record_once.py --out ../store --site ../site

      - name: Signals
        if: always() && steps.due.outputs.signals_due == 'true'
        working-directory: backend
        run: python signal_once.py --out ../store

      # Options traders' history: rebuilds past days within a time budget on every run while
      # behind, then one new day a day.
      - name: History
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.history_due == 'true')
        working-directory: backend
        run: python history_once.py --out ../store --budget 150

      - name: Build app data
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true')
        working-directory: backend
        run: python publish_site.py --data ../store --site ../site

      - name: Commit
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true')
        working-directory: store
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data

      # The app reads site-data only; it is replaced with a single commit each run (no history).
      - name: Publish app data
        if: always() && (steps.due.outputs.due == 'true' || steps.due.outputs.signals_due == 'true' || steps.due.outputs.history_due == 'true')
        run: |
          git worktree add -q --orphan -b site-out site-out
          cp -r site/. site-out/
          cd site-out
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "app data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin HEAD:site-data
