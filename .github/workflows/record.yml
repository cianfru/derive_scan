# Records Derive's options surface every 15 minutes into the `data` branch.
# Fires every 5 minutes (minutes 2, 7, ..., 57, off the busy top of the hour): scheduled runs
# can start late or be skipped, and a slot that is already recorded is not fetched again,
# so each slot gets up to three chances.
name: record

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: record
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          if git fetch -q --depth 1 origin data; then
            git worktree add -q -B data store FETCH_HEAD
          else
            git worktree add -q --orphan -b data store
          fi

      - name: Due?
        id: due
        working-directory: backend
        run: python3 record_once.py --out ../store --due

      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Record
        if: steps.due.outputs.due == 'true'
        working-directory: backend
        run: |
          pip install -q httpx
          python record_once.py --out ../store

      - name: Commit
        if: always() && steps.due.outputs.due == 'true'
        working-directory: store
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "record $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data
